<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1c1c28">
<title>AIMON</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main id="shell">
  <div id="screen-wrap">
    <canvas id="screen" width="240" height="160" aria-label="AIMON game screen"></canvas>
  </div>

  <div id="pad" aria-hidden="true">
    <div class="dpad">
      <button data-btn="up" class="d up"></button>
      <button data-btn="left" class="d left"></button>
      <button data-btn="right" class="d right"></button>
      <button data-btn="down" class="d down"></button>
      <span class="d mid"></span>
    </div>
    <div class="mid-btns">
      <button data-btn="select" class="pill">SELECT</button>
      <button data-btn="start" class="pill">START</button>
    </div>
    <div class="ab">
      <button data-btn="b" class="round b">B</button>
      <button data-btn="a" class="round a">A</button>
    </div>
  </div>

  <p id="keys">
    <b>Arrows/WASD</b> move &middot; <b>Z/Space</b> A &middot; <b>X/Esc</b> B &middot;
    <b>Enter</b> Start &middot; hold <b>X</b> or <b>Shift</b> to run &middot; <b>M</b> mute
  </p>
</main>
